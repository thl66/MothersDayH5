<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>妈妈，母亲节快乐</title>
    <link rel="stylesheet" href="./styles.css?v=20260509-10" />
  </head>
  <body>
    <canvas id="petalCanvas" class="petal-canvas" aria-hidden="true"></canvas>

    <main class="pages" aria-label="母亲节祝福页面">
      <section class="poster-page" aria-label="母亲节祝福海报">
        <img
          class="poster-image"
          src="./images/原图.png"
          alt=""
          aria-hidden="true"
        />

        <div class="light-shimmer" aria-hidden="true"></div>

        <section class="copy-block top-copy reveal">
          <p class="en-title">MOTHER’S DAY</p>
          <h1>母亲节</h1>
          <p>这一生的浪漫和宠溺记得<br />给妈妈留一份</p>
        </section>

        <section class="mom-watermark reveal" aria-hidden="true">
          <span>I LOVE YOU</span>
          <strong>MOM</strong>
        </section>

        <section class="copy-block bottom-copy reveal">
          <p class="main-text">爱在今日<br />更在每一个朝夕</p>
          <p class="sub-text">妈妈，我爱你！</p>
          <button id="petalButton" class="petal-button" type="button">再送一阵花</button>
        </section>
      </section>

      <section class="poster-page letter-page" aria-label="给妈妈的一封信">
        <img
          class="poster-image"
          src="./images/翻页图_原版.png"
          alt=""
          aria-hidden="true"
        />

        <article class="letter-typewriter" aria-label="写给妈妈的信">
          <p id="letterText" class="letter-text" aria-live="polite"></p>
        </article>

        <p class="family-blessing reveal">糕糕和小伦祝福妈妈母亲节快乐</p>
      </section>
    </main>

    <script src="./script.js?v=20260509-10"></script>
  </body>
</html>
